name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: togavsu
          POSTGRES_PASSWORD: synthetic-postgres-password
          POSTGRES_DB: togavsu_quickbooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U togavsu -d togavsu_quickbooks"
          --health-interval 5s
          --health-retries 12
    env:
      TOGAVSU_TEST_DATABASE_URL: postgres://togavsu:synthetic-postgres-password@127.0.0.1:5432/togavsu_quickbooks?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.22"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...
